<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starflight Starmap</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23000%22/%3E%3Ccircle cx=%225%22 cy=%226%22 r=%222.2%22 fill=%22%23f9ea10%22/%3E%3Ccircle cx=%2211%22 cy=%2211%22 r=%222.2%22 fill=%22%23f0571d%22/%3E%3Ccircle cx=%2212%22 cy=%224%22 r=%221.5%22 fill=%22%23a1dde9%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="map-wrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="Starflight star map">
      <defs>
        <clipPath id="plot-clip"><rect x="0" y="0" width="250" height="220" /></clipPath>
      </defs>
      <g id="world">
        <rect id="plot-bg" x="0" y="0" width="250" height="220" />
        <g id="layer-grid" class="layer"></g>
        <g id="layer-nebulae" class="layer" clip-path="url(#plot-clip)"></g>
        <g id="layer-territories" class="layer" clip-path="url(#plot-clip)"></g>
        <g id="layer-lines" class="layer"></g>
        <g id="layer-flux" class="layer"></g>
        <g id="layer-visited" class="layer"></g>
        <g id="layer-stars" class="layer"></g>
        <g id="layer-labels" class="layer"></g>
        <g id="layer-markers" class="layer"></g>
        <g id="layer-start" class="layer"></g>
        <g id="layer-selection"></g>
        <g id="layer-axes" class="layer"></g>
      </g>
    </svg>
    <div id="tooltip" hidden></div>
    <div id="zoom-controls">
      <button id="zoom-in" title="Zoom in (+)">+</button>
      <button id="zoom-out" title="Zoom out (-)">&minus;</button>
      <button id="zoom-fit" title="Fit map (0)">&#x2922;</button>
    </div>
    <div id="statusbar">
      <span id="cursor-pos">&nbsp;</span>
      <span id="mode-hint"></span>
      <span id="save-status"></span>
    </div>
  </main>

  <aside id="sidebar">
    <header>
      <h1>Starmap</h1>
      <button id="add-marker" class="primary" title="Then click the map (or double-click the map any time)">+ Add marker</button>
    </header>

    <section id="inspector" class="panel">
      <p class="empty">Click a star or marker. Double-click empty space to drop an encounter marker.</p>
    </section>

    <details class="panel" open>
      <summary>Layers</summary>
      <div id="layer-toggles" class="toggles"></div>
      <div id="class-toggles" class="legend"></div>
    </details>

    <details class="panel" open>
      <summary>Journal</summary>
      <input id="journal-filter" type="search" placeholder="Filter notes...">
      <ul id="journal" class="list"></ul>
    </details>

    <details class="panel">
      <summary>Territories</summary>
      <p class="hint">The circles on the original poster. Mark one discovered to shade it and give it a name.</p>
      <ul id="territories" class="list"></ul>
    </details>

    <details class="panel">
      <summary>General notes</summary>
      <textarea id="general-notes" rows="8" placeholder="Anything not tied to a place on the map..."></textarea>
    </details>

    <footer>
      <button id="export">Export notes</button>
      <label class="button">Import<input id="import" type="file" accept=".json,application/json" hidden></label>
    </footer>
  </aside>

  <script src="app.js"></script>
</body>
</html>
